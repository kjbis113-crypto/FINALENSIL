<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#192527" />
    <meta name="description" content="ENSIL creature archive." />
    <title>NO. 1 — ENSIL Archive</title>
    <link rel="icon" href="/assets/ensil-logo.png" type="image/png" />
    <link rel="stylesheet" href="/src/info.css" />
  </head>
  <body>
    <main class="info-page" aria-labelledby="creature-number">
      <div class="dither-background" id="dither-background" aria-hidden="true"></div>

      <a class="info-logo" href="/" aria-label="Return to the ENSIL gallery">
        <img src="/assets/ensil-logo.png" alt="ENSIL" />
      </a>

      <a class="back-to-interaction" href="/interactive.html?id=1" data-encrypted>
        BACK TO INTERACTION
      </a>

      <figure class="specimen-media" aria-label="Creature specimen image">
        <img class="specimen-image" src="/assets/info/no1.jpeg" alt="NO. 1 creature specimen" />
        <span class="specimen-color" aria-hidden="true"></span>
      </figure>

      <section class="fact fact-origin">
        <div class="fact-rule" aria-hidden="true"></div>
        <h2 data-encrypted>Origin</h2>
        <p data-field="origin" data-encrypted></p>
      </section>

      <section class="fact fact-story">
        <div class="fact-rule" aria-hidden="true"></div>
        <h2 data-encrypted>Story</h2>
        <p data-field="story" data-encrypted></p>
      </section>

      <section class="fact fact-character">
        <div class="fact-rule" aria-hidden="true"></div>
        <h2 data-encrypted>Character</h2>
        <p data-field="character" data-encrypted></p>
      </section>

      <a class="creature-number-link" href="/interactive.html?id=1" aria-label="Return to the NO. 1 point cloud">
        <h1 id="creature-number" data-encrypted>NO. 1</h1>
      </a>
    </main>

    <script type="module" src="/src/info.js"></script>
  </body>
</html>
